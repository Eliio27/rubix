<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<meta name="description" content="Cube Coach – Trainer für den echten 3×3 Zauberwürfel: Lernpfad, Drill mit Spaced Repetition, Timer und CFOP-Sets. Offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Cube Coach</title>
<style>
:root {
  --bg: #16130f; --bg2: #1d1915; --card: #25201a; --card2: #2e2820; --line: #3a3229;
  --text: #f2ebdf; --muted: #a89b88; --dim: #7b705f;
  --gold: #d9a845; --gold2: #f1c86a; --gold-ink: #241a08;
  --good: #7fb36a; --warn: #e3a04b; --bad: #d8654c; --info: #79a7c9;
  --b0: #3a3229; --b1: #c9573f; --b2: #df8c3c; --b3: #d9b445; --b4: #a2c062; --b5: #5fae6e;
  --r: 16px; --r-sm: 11px;
  --tap: 52px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); font: 17px/1.5 var(--font);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--gold2); }
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 700; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: .4em 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.hidden { display: none !important; }

/* ---------- Gerüst ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(var(--safe-t) + 8px) 12px 8px; min-height: 58px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 1.12rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .brand svg { width: 28px; height: 28px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  display: inline-grid; place-items: center; cursor: pointer; color: var(--text);
}
.icon-btn:active { background: var(--card); }
.icon-btn svg { width: 24px; height: 24px; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px calc(96px + var(--safe-b)); }
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--bg2) 94%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line); padding: 4px 4px calc(4px + var(--safe-b));
}
.tabs a {
  flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 0 5px; color: var(--muted); text-decoration: none; font-size: .74rem; border-radius: 12px; min-height: var(--tap);
}
.tabs a svg { width: 25px; height: 25px; }
.tabs a.on { color: var(--gold2); }
.tabs a.on svg { filter: drop-shadow(0 0 6px rgba(241, 200, 106, .35)); }
body.timing .tabs, body.timing .topbar { visibility: hidden; }

/* ---------- Bausteine ---------- */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; margin: 0 0 14px;
}
.card.flat { background: var(--bg2); }
.card.gold { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.stack > * + * { margin-top: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; }
.eyebrow { font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.section-title { margin: 22px 2px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.btn {
  min-height: var(--tap); padding: 0 20px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card2); font-weight: 650; cursor: pointer; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px; text-decoration: none; color: var(--text); user-select: none;
  touch-action: manipulation; transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn.primary:active { background: var(--gold2); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 64px; font-size: 1.12rem; border-radius: 18px; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .92rem; border-radius: 11px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.good { background: color-mix(in srgb, var(--good) 22%, var(--card2)); border-color: color-mix(in srgb, var(--good) 60%, var(--line)); }
.btn.warn { background: color-mix(in srgb, var(--warn) 18%, var(--card2)); border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.btn.bad { background: color-mix(in srgb, var(--bad) 18%, var(--card2)); border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.btns { display: grid; gap: 10px; }
.btns.two { grid-template-columns: 1fr 1fr; }
.btns.three { grid-template-columns: repeat(3, 1fr); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px;
  background: var(--card2); border: 1px solid var(--line); font-size: .82rem; color: var(--muted); white-space: nowrap;
}
.chip.gold { color: var(--gold2); border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); }
.chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.seg {
  display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px;
  overflow-x: auto; scrollbar-width: none;
}
.seg button {
  flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--muted);
  font-weight: 650; cursor: pointer; padding: 0 12px; white-space: nowrap;
}
.seg button.on { background: var(--card2); color: var(--gold2); box-shadow: inset 0 0 0 1px var(--line); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); cursor: pointer; }
.switch input { appearance: none; width: 52px; height: 32px; border-radius: 99px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--text); transition: transform .2s; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(20px); background: var(--gold-ink); }
.progress { height: 8px; border-radius: 99px; background: var(--bg2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; }
.empty { text-align: center; padding: 28px 12px; }
.empty .big-ico { font-size: 2.6rem; margin-bottom: 6px; }
.toast {
  position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%) translateY(20px);
  background: var(--card2); border: 1px solid var(--gold); color: var(--text); padding: 12px 18px; border-radius: 14px;
  z-index: 100; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Algorithmen ---------- */
.alg { font-family: var(--mono); font-size: 1.5rem; font-weight: 650; letter-spacing: .02em; line-height: 1.45; word-spacing: .18em; color: var(--gold2); overflow-wrap: anywhere; }
.alg.md { font-size: 1.15rem; }
.alg.sm { font-size: .95rem; color: var(--text); }
.alg .auf { color: var(--muted); font-weight: 500; }
.moves { display: flex; flex-wrap: wrap; gap: 6px; }
.mv {
  font-family: var(--mono); font-weight: 700; font-size: 1.05rem; min-width: 42px; height: 38px; padding: 0 8px;
  display: inline-grid; place-items: center; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); color: var(--muted);
}
.mv.done { color: var(--dim); background: transparent; border-style: dashed; }
.mv.now { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); transform: scale(1.06); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
.kv dt { color: var(--gold); font-weight: 650; }
.kv dd { margin: 0; }

/* ---------- Diagramme ---------- */
.dia { display: block; width: 100%; height: auto; }
.dias { display: flex; gap: 12px; justify-content: center; align-items: center; }
.dias > .dia { flex: 1 1 0; min-width: 0; max-width: 220px; }
.dias.lg > .dia { max-width: 280px; }
.dias .cap { font-size: .72rem; color: var(--muted); text-align: center; }
.dia-wrap { flex: 1 1 0; min-width: 0; max-width: 240px; }
.dia-net { max-width: 320px; margin: 0 auto; }

/* ---------- Lernpfad ---------- */
.lesson-item {
  display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; min-height: 84px;
}
.lesson-item:active { background: var(--card2); }
.lesson-item .nr {
  width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
  background: var(--bg2); border: 2px solid var(--line); color: var(--muted);
}
.lesson-item.done .nr { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.lesson-item .thumb { width: 60px; flex: none; }
.lesson-item .t { flex: 1; min-width: 0; }
.lesson-item .t b { display: block; font-size: 1.04rem; }
.lesson-item .t span { display: block; color: var(--muted); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.scenario .head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.scenario .dias { margin: 6px 0 12px; }
.move-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.move-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; text-align: center; cursor: pointer; color: inherit; }
.move-card .alg { font-size: 1.6rem; }
.move-card .dia { max-width: 140px; margin: 0 auto; }
.move-card:active { background: var(--card2); }

/* ---------- Trainer (Zug für Zug) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(var(--safe-t) + 6px) 0 calc(var(--safe-b) + 10px); animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(16px); opacity: 0; } }
.overlay .ov-head { display: flex; align-items: center; gap: 8px; padding: 4px 12px; }
.overlay .ov-head h2 { flex: 1; font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overlay .ov-body { flex: 1; overflow-y: auto; padding: 8px 16px; max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.overlay .ov-foot { padding: 8px 16px 0; max-width: 760px; width: 100%; margin: 0 auto; }
.step-move { text-align: center; }
.step-move .big-move { font-family: var(--mono); font-size: 4.2rem; font-weight: 800; color: var(--gold2); line-height: 1; }
.step-move .desc { color: var(--text); font-size: 1.05rem; margin-top: 6px; min-height: 1.5em; }
.step-move .count { color: var(--muted); font-size: .85rem; margin-top: 2px; }

/* ---------- 3D-Würfel ---------- */
.c3 { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1; margin: 0 auto; perspective: 900px; touch-action: none; cursor: grab; }
.c3-cube { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.c3-cubie { position: absolute; transform-style: preserve-3d; }
.c3-face { position: absolute; inset: 0; background: #0d0b09; border-radius: 6%; }
.c3-face i { position: absolute; inset: 7%; border-radius: 13%; }
.player .moves { justify-content: center; }
.player-ctrl { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.player-ctrl .btn { padding: 0; }
.speed { display: flex; gap: 6px; justify-content: center; align-items: center; }

/* ---------- Drill ---------- */
.drill-card .dias { margin: 4px 0 10px; }
.options { display: grid; gap: 10px; }
.option {
  text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card2); cursor: pointer; font-family: var(--mono); font-size: 1rem; line-height: 1.4; color: var(--text);
}
.option.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, var(--card2)); }
.option.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 22%, var(--card2)); }
.option[disabled] { cursor: default; }
.stats-line { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.box-pill { display: inline-flex; gap: 3px; }
.box-pill i { width: 12px; height: 8px; border-radius: 3px; background: var(--line); }
.box-pill i.on { background: var(--gold); }

/* ---------- Übersicht ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.tile {
  background: var(--card); border: 2px solid var(--b0); border-radius: 14px; padding: 8px 6px 6px; text-align: center;
  text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 4px; position: relative;
}
.tile:active { transform: scale(.97); }
.tile b { font-size: .86rem; }
.tile .dia { max-width: 84px; margin: 0 auto; }
.tile.b1 { border-color: var(--b1); } .tile.b2 { border-color: var(--b2); } .tile.b3 { border-color: var(--b3); }
.tile.b4 { border-color: var(--b4); } .tile.b5 { border-color: var(--b5); }
.tile.indrill::after { content: ""; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 2px solid; }

/* ---------- Timer ---------- */
.scramble { font-family: var(--mono); font-size: 1.22rem; line-height: 1.6; word-spacing: .22em; text-align: center; font-weight: 600; }
.timer-pad {
  user-select: none; -webkit-user-select: none; touch-action: none; cursor: pointer;
  border-radius: 22px; background: var(--bg2); border: 1px solid var(--line); padding: 34px 12px; text-align: center; min-height: 230px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
}
.timer-pad .time { font-family: var(--mono); font-size: clamp(3.6rem, 19vw, 6.5rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.timer-pad.holding .time { color: var(--bad); }
.timer-pad.ready .time { color: var(--good); }
.timer-pad.inspect .time { color: var(--warn); }
.timer-pad.running .time { color: var(--text); }
body.timing .timer-pad { position: fixed; inset: 0; z-index: 80; border-radius: 0; border: 0; background: var(--bg); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-family: var(--mono); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.times { list-style: none; margin: 0; padding: 0; }
.times li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.times li .n { color: var(--dim); width: 34px; font-size: .85rem; }
.times li .t { flex: 1; font-family: var(--mono); font-size: 1.08rem; font-variant-numeric: tabular-nums; }
.times li .btn { min-height: 38px; padding: 0 10px; font-size: .82rem; }
.times li .btn.on { border-color: var(--warn); color: var(--warn); }

@media (min-width: 640px) {
  .stat b { font-size: 1.25rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); }
  .tile .dia { max-width: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn hidden" id="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title" class="brand">Cube Coach</h1>
  <span id="top-actions"></span>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>
<div id="overlay-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Cube Coach braucht JavaScript.</p></noscript>
<script id="engine">
/* ===== Würfel-Engine ===== */
const Cube = (() => {
  'use strict';
  // Flächen-Reihenfolge und Sticker-Index: face*9 + row*3 + col
  const FACES = ['U', 'R', 'F', 'D', 'L', 'B'];
  const NORMALS = { U: [0, 1, 0], R: [1, 0, 0], F: [0, 0, 1], D: [0, -1, 0], L: [-1, 0, 0], B: [0, 0, -1] };
  // Farben im gelösten Zustand: Gelb oben, Grün vorne (Weiss unten)
  const COLORS = { U: '#f5d000', R: '#ff7a1a', F: '#16a34a', D: '#f4f4f0', L: '#d62828', B: '#1d5fd1' };
  const COLOR_NAMES = { U: 'Gelb', R: 'Orange', F: 'Grün', D: 'Weiss', L: 'Rot', B: 'Blau' };

  // 3D-Position (Würfelchen-Mittelpunkt, Koordinaten -1..1) eines Stickers.
  // x nach rechts, y nach oben, z nach vorne.
  function posOf(face, r, c) {
    switch (face) {
      case 'U': return [c - 1, 1, r - 1];
      case 'D': return [c - 1, -1, 1 - r];
      case 'F': return [c - 1, 1 - r, 1];
      case 'B': return [1 - c, 1 - r, -1];
      case 'R': return [1, 1 - r, 1 - c];
      case 'L': return [-1, 1 - r, c - 1];
    }
  }

  const STICKERS = [];
  const INDEX = new Map();
  const key = (p, n) => p.join(',') + '|' + n.join(',');
  FACES.forEach((face, f) => {
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const pos = posOf(face, r, c), n = NORMALS[face];
      const i = f * 9 + r * 3 + c;
      STICKERS.push({ i, face, r, c, pos, n });
      INDEX.set(key(pos, n), i);
    }
  });

  // Würfelchen (Pieces): Position -> Sticker-Indizes
  const PIECES = new Map();
  STICKERS.forEach(s => {
    const k = s.pos.join(',');
    if (!PIECES.has(k)) PIECES.set(k, []);
    PIECES.get(k).push(s.i);
  });
  const pieceOf = i => PIECES.get(STICKERS[i].pos.join(','));
  const pieceType = i => ['core', 'center', 'edge', 'corner'][STICKERS[i].pos.filter(v => v !== 0).length];
  const pieceFaces = i => pieceOf(i).map(j => STICKERS[j].face);

  const AX = { x: 0, y: 1, z: 2 };
  // Vierteldrehung um Achse, q=+1: +90° (Rechte-Hand-Regel)
  function rot(v, axis, q) {
    const [x, y, z] = v;
    const s = q > 0 ? 1 : -1;
    if (axis === 'x') return [x, -s * z, s * y];
    if (axis === 'y') return [s * z, y, -s * x];
    return [-s * y, s * x, z];
  }

  // Grundzüge: Achse, betroffene Schichten, Drehsinn (Uhrzeigersinn von der Fläche aus gesehen)
  const ALL = [-1, 0, 1];
  const MOVE_DEFS = {
    R: ['x', [1], -1], L: ['x', [-1], 1], M: ['x', [0], 1], r: ['x', [0, 1], -1], l: ['x', [-1, 0], 1], x: ['x', ALL, -1],
    U: ['y', [1], -1], D: ['y', [-1], 1], E: ['y', [0], 1], u: ['y', [0, 1], -1], d: ['y', [-1, 0], 1], y: ['y', ALL, -1],
    F: ['z', [1], -1], B: ['z', [-1], 1], S: ['z', [0], -1], f: ['z', [0, 1], -1], b: ['z', [-1, 0], 1], z: ['z', ALL, -1],
  };

  // Permutationen: PERM[move][k-1][i] = Ziel-Index von Sticker i nach k Vierteldrehungen
  const PERM = {};
  for (const [m, [axis, layers, q]] of Object.entries(MOVE_DEFS)) {
    const p1 = STICKERS.map(s => {
      if (!layers.includes(s.pos[AX[axis]])) return s.i;
      return INDEX.get(key(rot(s.pos, axis, q), rot(s.n, axis, q)));
    });
    const p2 = p1.map(j => p1[j]);
    const p3 = p2.map(j => p1[j]);
    PERM[m] = [p1, p2, p3];
  }

  const solved = () => STICKERS.map(s => s.i);
  const isSolved = st => st.every((v, i) => v === i);

  // Zustand: st[i] = ursprünglicher Sticker, der jetzt an Position i liegt
  function applyMove(st, mv) {
    const p = PERM[mv.base][mv.amount - 1];
    const out = new Array(54);
    for (let i = 0; i < 54; i++) out[p[i]] = st[i];
    return out;
  }
  function apply(st, alg) {
    const moves = typeof alg === 'string' ? parse(alg) : alg;
    return moves.reduce(applyMove, st);
  }

  // Notation: R U R' U2, Rw/r (wide), M E S, x y z, Klammern werden ignoriert, (..)2 / (..)3 wiederholt
  function parse(str) {
    if (!str) return [];
    str = String(str).replace(/[’`´]/g, "'").replace(/\[|\]/g, '');
    // Gruppen-Wiederholung (A B)2
    let prev;
    do {
      prev = str;
      str = str.replace(/\(([^()]*)\)\s*(\d)?/g, (_, inner, n) => (' ' + inner + ' ').repeat(n ? +n : 1));
    } while (str !== prev);
    const out = [];
    const re = /([RLUDFBMESxyzrludfb])(w?)(\d*)('?)/g;
    let m;
    const cleaned = str.replace(/\s+/g, ' ');
    let consumed = 0;
    while ((m = re.exec(cleaned))) {
      if (cleaned.slice(consumed, m.index).trim()) throw new Error('Unbekannte Notation: ' + cleaned.slice(consumed, m.index));
      consumed = m.index + m[0].length;
      let base = m[1];
      if (m[2]) { if (!'RLUDFB'.includes(base)) throw new Error('Ungültig: ' + m[0]); base = base.toLowerCase(); }
      let n = m[3] ? parseInt(m[3], 10) : 1;
      if (m[4]) n = -n;
      const amount = ((n % 4) + 4) % 4;
      if (amount) out.push({ base, amount });
    }
    if (cleaned.slice(consumed).trim()) throw new Error('Unbekannte Notation: ' + cleaned.slice(consumed));
    return out;
  }
  const moveStr = mv => mv.base + (mv.amount === 2 ? '2' : mv.amount === 3 ? "'" : '');
  const format = moves => moves.map(moveStr).join(' ');
  const invert = alg => {
    const moves = typeof alg === 'string' ? parse(alg) : alg;
    return moves.slice().reverse().map(m => ({ base: m.base, amount: 4 - m.amount }));
  };
  const invertStr = alg => format(invert(alg));

  // Fall-Zustand: invertierter Algorithmus auf den gelösten Würfel angewendet
  const caseState = (alg, pre) => apply(pre ? apply(solved(), pre) : solved(), invert(alg));

  // Scramble: 20 Züge, keine Folgezüge auf derselben Fläche, keine "R L R"-Redundanz
  const FACE_AXIS = { R: 0, L: 0, U: 1, D: 1, F: 2, B: 2 };
  function scramble(len = 20, rnd = Math.random) {
    const faces = 'RLUDFB';
    const out = [];
    while (out.length < len) {
      const f = faces[Math.floor(rnd() * 6)];
      const a = out[out.length - 1], b = out[out.length - 2];
      if (a && a.base === f) continue;
      if (a && b && FACE_AXIS[a.base] === FACE_AXIS[f] && FACE_AXIS[b.base] === FACE_AXIS[f]) continue;
      out.push({ base: f, amount: 1 + Math.floor(rnd() * 3) });
    }
    return format(out);
  }

  // Farbe eines Stickers (anhand des Ursprungs)
  const faceOfOrig = o => FACES[Math.floor(o / 9)];
  const colorAt = (st, i) => COLORS[faceOfOrig(st[i])];

  // Alle 24 Würfel-Orientierungen
  const ROTATIONS = (() => {
    const res = [];
    const seen = new Set();
    for (const a of ['', 'x', 'x2', "x'", 'z', "z'"]) for (const b of ['', 'y', 'y2', "y'"]) {
      const alg = (a + ' ' + b).trim();
      const st = apply(solved(), alg);
      const k = st.join(',');
      if (!seen.has(k)) { seen.add(k); res.push(alg); }
    }
    return res;
  })();
  // Gelöst unabhängig von der Haltung
  const isSolvedAnyOrientation = st => ROTATIONS.some(r => isSolved(apply(st, r)));
  // Mittelsteine an ihrem Platz?
  const centersHome = st => [4, 13, 22, 31, 40, 49].every(i => st[i] === i);

  // Helfer für Tests/Erkennung
  const stickersWhere = pred => STICKERS.filter(pred).map(s => s.i);
  const U_LAYER = stickersWhere(s => s.pos[1] === 1);
  const F2L = stickersWhere(s => s.pos[1] < 1);

  return {
    FACES, NORMALS, COLORS, COLOR_NAMES, STICKERS, PIECES, MOVE_DEFS, PERM, ROTATIONS, U_LAYER, F2L, AX,
    indexOf: (p, n) => INDEX.get(key(p, n)),
    posOf, rot, pieceOf, pieceType, pieceFaces, solved, isSolved, isSolvedAnyOrientation, centersHome,
    applyMove, apply, parse, format, moveStr, invert, invertStr, caseState, scramble, faceOfOrig, colorAt,
  };
})();
</script>
<script id="render">
/* ===== SVG-Diagramme ===== */
const Render = (() => {
  'use strict';
  const C = Cube;
  const GREY = '#5a534b', BODY = '#0d0b09', ARROW = '#f2c14e', ARROW_EDGE = '#1a1410';
  const INFO = C.STICKERS.map(s => ({ t: C.pieceType(s.i), faces: C.pieceFaces(s.i) }));

  // Masken: welche Sticker farbig, grau oder nur-gelb dargestellt werden (anhand des Ursprungs-Stickers)
  const MASKS = {
    full: () => 'c',
    cross: f => f.t === 'center' || (f.t === 'edge' && f.faces.includes('D')) ? 'c' : 'g',
    firstLayer: f => f.t === 'center' || f.faces.includes('D') ? 'c' : 'g',
    f2l: f => f.t === 'center' || !f.faces.includes('U') ? 'c' : 'g',
    llEdges: f => f.t === 'center' || !f.faces.includes('U') ? 'c' : f.t === 'edge' ? 'y' : 'g',
    oll: f => !f.faces.includes('U') ? 'c' : 'y',
    llCorners: f => !f.faces.includes('U') || f.t === 'corner' ? 'c' : 'y',
    pll: () => 'c',
  };
  function color(st, i, mask) {
    const o = st[i];
    const m = (MASKS[mask] || MASKS.full)(INFO[o]);
    const face = C.faceOfOrig(o);
    if (m === 'g') return GREY;
    if (m === 'y') return face === 'U' ? C.COLORS.U : GREY;
    return C.COLORS[face];
  }

  const f2 = n => Math.round(n * 1000) / 1000;
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k];
  const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };

  // Pfeil (Linie + Spitze) in 2D
  function arrow2d(pts, { w = 0.13, head = 0.34, label = '', both = false, fill = ARROW, edge = ARROW_EDGE } = {}) {
    const n = pts.length;
    const [x1, y1] = pts[n - 2], [x2, y2] = pts[n - 1];
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const tip = (x, y, a) => {
      const bx = x - Math.cos(a) * head, by = y - Math.sin(a) * head;
      const px = Math.cos(a + Math.PI / 2) * head * 0.55, py = Math.sin(a + Math.PI / 2) * head * 0.55;
      return `${f2(x)},${f2(y)} ${f2(bx + px)},${f2(by + py)} ${f2(bx - px)},${f2(by - py)}`;
    };
    // Linie endet vor der Spitze
    const line = pts.map((p, i) => {
      let [x, y] = p;
      if (i === n - 1) { x -= Math.cos(ang) * head * 0.8; y -= Math.sin(ang) * head * 0.8; }
      if (i === 0 && both) { const a0 = Math.atan2(pts[1][1] - y, pts[1][0] - x); x += Math.cos(a0) * head * 0.8; y += Math.sin(a0) * head * 0.8; }
      return `${f2(x)},${f2(y)}`;
    }).join(' ');
    let heads = `<polygon points="${tip(x2, y2, ang)}"/>`;
    if (both) {
      const a0 = Math.atan2(pts[0][1] - pts[1][1], pts[0][0] - pts[1][0]);
      heads += `<polygon points="${tip(pts[0][0], pts[0][1], a0)}"/>`;
    }
    let lab = '';
    if (label) {
      lab = `<text x="${f2(x2 + Math.cos(ang) * 0.32)}" y="${f2(y2 + Math.sin(ang) * 0.32 + 0.14)}" font-size="0.42" font-weight="700" text-anchor="middle" fill="${ARROW}" stroke="${ARROW_EDGE}" stroke-width="0.08" paint-order="stroke">${label}</text>`;
    }
    const halo = edge ? `<polyline points="${line}" fill="none" stroke="${edge}" stroke-width="${f2(w + 0.1)}" stroke-linecap="round" stroke-linejoin="round"/>` : '';
    return `<g class="arr">${halo}<polyline points="${line}" fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<g fill="${fill}" stroke="${edge || fill}" stroke-width="0.05" stroke-linejoin="round">${heads}</g>${lab}</g>`;
  }

  /* --- Draufsicht der oberen Ebene mit Seitenstreifen (OLL/PLL) --- */
  function top(st, o = {}) {
    const mask = o.mask || 'pll';
    let out = `<rect x="-1.56" y="-1.56" width="3.12" height="3.12" rx="0.16" fill="${BODY}"/>`;
    for (const i of C.U_LAYER) {
      const s = C.STICKERS[i];
      const col = color(st, i, mask);
      if (s.face === 'U') {
        out += `<rect x="${s.pos[0] - 0.45}" y="${s.pos[2] - 0.45}" width="0.9" height="0.9" rx="0.12" fill="${col}"/>`;
      } else {
        const [nx, , nz] = s.n;
        const cx = nx ? nx * 1.8 : s.pos[0], cy = nz ? nz * 1.8 : s.pos[2];
        const w = nx ? 0.3 : 0.86, h = nx ? 0.86 : 0.3;
        out += `<rect x="${f2(cx - w / 2)}" y="${f2(cy - h / 2)}" width="${w}" height="${h}" rx="0.08" fill="${col}"/>`;
      }
    }
    if (o.arrows) out += pllArrows(st);
    return `<svg class="dia dia-top" viewBox="-2.05 -2.05 4.1 4.1" role="img" aria-label="${o.label || 'Draufsicht obere Ebene'}">${out}</svg>`;
  }

  // Pfeile: von wo nach wo sich die Teile der oberen Ebene bewegen
  function pllArrows(st) {
    const cell = i => [C.STICKERS[i].pos[0], C.STICKERS[i].pos[2]];
    const done = new Set();
    let out = '';
    for (const i of [0, 1, 2, 3, 5, 6, 7, 8]) {
      const o = st[i];
      if (o > 8 || o === i || done.has(i + '>' + o)) continue;
      const both = st[o] === i;
      if (both) done.add(o + '>' + i);
      let [x1, y1] = cell(i), [x2, y2] = cell(o);
      const d = Math.hypot(x2 - x1, y2 - y1), k = 0.22 / d;
      x1 += (x2 - x1) * k; y1 += (y2 - y1) * k; x2 -= (x2 - x1) * k; y2 -= (y2 - y1) * k;
      out += arrow2d([[x1, y1], [x2, y2]], { w: 0.085, head: 0.3, both, fill: '#1b1611', edge: '' });
    }
    return out;
  }

  /* --- Schrägansicht mit 3 sichtbaren Seiten --- */
  function camera(bottom) {
    const V = norm([1, bottom ? -1.1 : 1.1, 1.4]);
    const R = norm([V[2], 0, -V[0]]);
    const Up = cross(V, R);
    return { V, P: p => [dot(p, R), -dot(p, Up)] };
  }
  const TANGENTS = { U: [[1, 0, 0], [0, 0, 1]], D: [[1, 0, 0], [0, 0, 1]], F: [[1, 0, 0], [0, 1, 0]], B: [[1, 0, 0], [0, 1, 0]], R: [[0, 0, 1], [0, 1, 0]], L: [[0, 0, 1], [0, 1, 0]] };
  const SHADE = { U: 0, D: 0.12, F: 0.1, R: 0.22 };

  function iso(st, o = {}) {
    const mask = o.mask || 'full';
    const cam = camera(o.bottom);
    const poly = pts => pts.map(p => cam.P(p).map(f2).join(',')).join(' ');
    let out = '';
    const visible = C.FACES.filter(f => dot(C.NORMALS[f], cam.V) > 0);
    for (const f of visible) {
      const n = C.NORMALS[f], [a, b] = TANGENTS[f];
      const c = n.map(v => v * 1.5);
      out += `<polygon points="${poly([add(add(c, a, -1.5), b, -1.5), add(add(c, a, 1.5), b, -1.5), add(add(c, a, 1.5), b, 1.5), add(add(c, a, -1.5), b, 1.5)])}" fill="${BODY}" stroke="${BODY}" stroke-width="0.08" stroke-linejoin="round"/>`;
      let g = '';
      for (const s of C.STICKERS) {
        if (s.face !== f) continue;
        const p = add(s.pos, n, 0.5), k = 0.43;
        g += `<polygon points="${poly([add(add(p, a, -k), b, -k), add(add(p, a, k), b, -k), add(add(p, a, k), b, k), add(add(p, a, -k), b, k)])}" fill="${color(st, s.i, mask)}" stroke="${color(st, s.i, mask)}" stroke-width="0.07" stroke-linejoin="round"/>`;
      }
      out += g;
      if (SHADE[f]) {
        out += `<polygon points="${poly([add(add(c, a, -1.5), b, -1.5), add(add(c, a, 1.5), b, -1.5), add(add(c, a, 1.5), b, 1.5), add(add(c, a, -1.5), b, 1.5)])}" fill="#000" opacity="${SHADE[f]}" pointer-events="none"/>`;
      }
    }
    if (o.move) out += moveArrows(o.move, cam, visible);
    // Bounding Box
    const pts = [];
    for (const x of [-1.5, 1.5]) for (const y of [-1.5, 1.5]) for (const z of [-1.5, 1.5]) pts.push(cam.P([x, y, z]));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), m = 0.35;
    const vb = [Math.min(...xs) - m, Math.min(...ys) - m, Math.max(...xs) - Math.min(...xs) + 2 * m, Math.max(...ys) - Math.min(...ys) + 2 * m].map(f2).join(' ');
    return `<svg class="dia dia-iso" viewBox="${vb}" role="img" aria-label="${o.label || (o.bottom ? 'Ansicht von unten' : 'Schrägansicht')}">${out}</svg>`;
  }

  // Pfeile für einen Zug auf den sichtbaren Seiten
  function moveArrows(mv, cam, visible) {
    if (typeof mv === 'string') mv = C.parse(mv)[0];
    if (!mv) return '';
    const [axis, layers, q] = C.MOVE_DEFS[mv.base];
    const ai = C.AX[axis];
    const axisV = [0, 0, 0]; axisV[ai] = 1;
    const dir = mv.amount === 3 ? -q : q;
    const omega = axisV.map(v => v * dir);
    const isRot = 'xyz'.includes(mv.base);
    const strips = isRot ? [0] : layers;
    let out = '';
    for (const f of visible) {
      const n = C.NORMALS[f];
      if (n[ai] !== 0) continue;
      for (const L of strips) {
        const pts = C.STICKERS.filter(s => s.face === f && s.pos[ai] === L).map(s => add(s.pos, n, 0.5));
        const mid = pts.reduce((a, p) => add(a, p, 1 / pts.length), [0, 0, 0]);
        const vel = cross(omega, mid);
        pts.sort((p1, p2) => dot(p1, vel) - dot(p2, vel));
        const t = norm(add(pts[2], pts[0], -1));
        const a = add(pts[0], t, -0.4), b = add(pts[2], t, 0.45);
        out += arrow2d([cam.P(a), cam.P(b)], { w: isRot ? 0.16 : 0.13, label: mv.amount === 2 ? '2' : '' });
      }
    }
    return out;
  }

  /* --- Netz (für Scramble-Vorschau) --- */
  function net(st, o = {}) {
    const OFF = { U: [3, 0], L: [0, 3], F: [3, 3], R: [6, 3], B: [9, 3], D: [3, 6] };
    let out = '';
    for (const s of C.STICKERS) {
      const [ox, oy] = OFF[s.face];
      out += `<rect x="${ox + s.c + 0.05}" y="${oy + s.r + 0.05}" width="0.9" height="0.9" rx="0.12" fill="${color(st, s.i, o.mask || 'full')}"/>`;
    }
    return `<svg class="dia dia-net" viewBox="-0.2 -0.2 12.4 9.4" role="img" aria-label="${o.label || 'Würfelnetz'}">${out}</svg>`;
  }

  return { MASKS, color, top, iso, net, moveArrows, arrow2d };
})();
</script>

<script id="app">
/* Phase 1: Diagramm-Werkstatt (Vorschau der Engine) */
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const $ = s => document.querySelector(s);
  const set = id => DATA.sets.find(s => s.id === id);
  const full = c => (c.alg + ' ' + (c.auf || '')).trim();
  const moves = ['R', "R'", 'L', "L'", 'U', "U'", 'D', "D'", 'F', "F'", 'B', "B'", 'M', 'E', 'S', 'r', 'x', 'y', 'z', 'R2'];
  let h = '<h2>Engine & Diagramme</h2><p class="muted">Phase 1: Alle Bilder werden aus den Algorithmen erzeugt (invertiertes Alg auf gelösten Würfel).</p>';
  h += '<div class="section-title"><h3>Zug-Pfeile</h3></div><div class="move-grid">' + moves.map(m => `<div class="move-card"><div class="alg">${m}</div>${Render.iso(Cube.solved(), { move: m })}</div>`).join('') + '</div>';
  const sc = Cube.scramble();
  h += `<div class="section-title"><h3>Scramble</h3></div><div class="card"><p class="scramble">${sc}</p>${Render.net(Cube.apply(Cube.solved(), sc))}<div class="dias">${Render.iso(Cube.apply(Cube.solved(), sc))}${Render.iso(Cube.apply(Cube.solved(), sc), { bottom: true })}</div></div>`;
  for (const id of ['pll', 'oll']) {
    const s = set(id);
    h += `<div class="section-title"><h3>${s.name} (${s.cases.length})</h3></div><div class="grid">` + s.cases.map(c => `<div class="tile">${Render.top(Cube.caseState(full(c)), { mask: s.mask, arrows: s.arrows })}<b>${c.short}</b></div>`).join('') + '</div>';
  }
  $('#view').innerHTML = h;
})();
</script>
