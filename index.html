  // Lernpfad
  VIEWS.learn = () => {
    const learned = Store.s.learned;
    const n = LESSONS.filter(l => learned[l.id]).length;
    const nextL = LESSONS.find(l => !learned[l.id]);
    let h = `<div class="card gold">
      <div class="eyebrow">Dein Lernpfad · Anfängermethode</div>
      <h2 style="margin:4px 0 8px">${nextL ? 'Weiter mit Lektion ' + nextL.nr : 'Alle Lektionen gelernt!'}</h2>
      <div class="progress" aria-label="${n} von ${LESSONS.length}"><i style="width:${(n / LESSONS.length) * 100}%"></i></div>
      <p class="muted small" style="margin-top:8px">${n} von ${LESSONS.length} Lektionen gelernt. Gelernte Fälle kommen in den Drill.</p>
      ${nextL ? `<a class="btn primary block" href="#/lesson/${nextL.id}" style="margin-top:6px">${esc(nextL.title)} öffnen</a>` : `<a class="btn primary block" href="#/drill" style="margin-top:6px">Zum Drill</a>`}
    </div>`;
    h += LESSONS.map(l => {
      const goalSt = Cube.solved();
      const thumb = Render.iso(goalSt, { mask: l.mask, bottom: (l.goalViews || l.views)[0] === 'isoD' });
      return `<a class="lesson-item ${learned[l.id] ? 'done' : ''}" href="#/lesson/${l.id}">
        <span class="nr">${learned[l.id] ? ICON.check.replace('<svg', '<svg width="22" height="22"') : l.nr}</span>
        <span class="t"><b>${esc(l.title)}</b><span>${esc(l.goal)}</span></span>
        <span class="thumb">${thumb}</span></a>`;
    }).join('');
    return { title: 'Lernpfad', tab: 'learn', html: h, brand: true };
  };

  // Lektion
  VIEWS.lesson = id => {
    const l = LESSONS.find(x => x.id === id);
    if (!l) return VIEWS.learn();
    const learned = Store.s.learned[l.id];
    const goalSt = Cube.solved();
    const goalDias = (l.goalViews || l.views).map(v => v === 'top' ? Render.top(goalSt, { mask: l.mask }) : Render.iso(goalSt, { mask: l.mask, bottom: v === 'isoD' })).join('');
    let h = `<div class="eyebrow">Lektion ${l.nr}</div><h2 style="margin:2px 0 14px">${esc(l.title)}</h2>
      <div class="card gold"><div class="eyebrow">Ziel</div><p>${esc(l.goal)}</p><div class="dias lg">${goalDias}</div></div>
      <div class="card flat stack">${l.intro.map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
    if (l.tip) h += `<div class="card flat"><div class="eyebrow">Tipp</div><p>${esc(l.tip)}</p></div>`;
    h += `<div class="section-title"><h3>${l.nr === 0 ? 'Die Grundzüge' : 'Szenarien'}</h3><span class="muted small">${l.cases.length} ${l.nr === 0 ? 'Züge' : 'Fälle'}</span></div>`;
    if (l.nr === 0) {
      h += `<p class="muted small">Tippe auf einen Zug, um ihn Schritt für Schritt (auch in 3D) zu sehen. Mach jeden Zug am echten Würfel nach – und gleich wieder zurück.</p><div class="move-grid">` +
        l.cases.map(c => `<button class="move-card" data-steps="${c.id}"><div class="alg">${esc(c.name)}</div>${dia(CASES.get(c.id), 'iso')}<div class="small">${esc(c.recognize)}</div></button>`).join('') + '</div>';
    } else {
      h += l.cases.map((c0, k) => {
        const c = CASES.get(c0.id);
        return `<div class="card scenario">
          <div class="head"><h3>${k + 1}. ${esc(c.name)}</h3></div>
          ${dias(c)}
          <dl class="kv"><dt>Erkennen</dt><dd>${esc(c.recognize)}</dd><dt>Halten</dt><dd>${esc(c.hold)}</dd></dl>
          <div style="margin:14px 0 12px">${algHTML(c)}<div class="muted small">${Cube.parse(c.full).length} Züge</div></div>
          ${caseButtons(c)}
        </div>`;
      }).join('');
    }
    const nextL = LESSONS.find(x => x.nr === l.nr + 1);
    h += `<div class="card ${learned ? '' : 'gold'}" style="margin-top:22px">
      ${learned
        ? `<p><b style="color:var(--good)">✓ Gelernt</b> <span class="muted">(${new Date(learned).toLocaleDateString('de-CH')})</span>. Die ${l.cases.length} Fälle sind im Drill.</p>
           <div class="btns two"><a class="btn primary" href="#/drill">Zum Drill</a><button class="btn" data-unlearn>Wieder offen</button></div>`
        : `<p>Kannst du alle ${l.nr === 0 ? 'Züge' : 'Szenarien'} am echten Würfel? Dann markiere die Lektion als gelernt – ihre Fälle kommen in den Drill.</p>
           <button class="btn primary big block" data-learn>${ICON.check} Lektion als gelernt markieren</button>`}
    </div>`;
    h += `<div class="btns two">${l.nr > 0 ? `<a class="btn ghost" href="#/lesson/${LESSONS[l.nr - 1].id}">← Lektion ${l.nr - 1}</a>` : '<span></span>'}${nextL ? `<a class="btn ghost" href="#/lesson/${nextL.id}">Lektion ${nextL.nr} →</a>` : ''}</div>`;
    return {
      title: `Lektion ${l.nr}`, back: '#/learn', tab: 'learn', wake: true, html: h,
      mount(el) {
        bindCaseButtons(el);
        const lb = $('[data-learn]', el);
        if (lb) lb.addEventListener('click', () => {
          Store.s.learned[l.id] = now();
          for (const c of l.cases) if (!Store.s.cards[c.id]) Store.s.cards[c.id] = Logic.newCard(now());
          Store.save();
          toast(`Lektion ${l.nr} gelernt – ${l.cases.length} Fälle im Drill`);
          render();
        });
        const ub = $('[data-unlearn]', el);
        if (ub) ub.addEventListener('click', () => { delete Store.s.learned[l.id]; Store.save(); render(); });
      },
    };
  };

  /* ---------- Drill (Leitner) ---------- */
  const D = { id: null, phase: 'setup', options: null, picked: null, ahead: false, last: null, session: 0, showAlg: false };
  const SET_NAMES = { beginner: 'Anfänger', pll: 'PLL', oll: 'OLL', f2l: 'F2L' };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const allDrillIds = () => Object.keys(Store.s.cards).filter(id => CASES.has(id));
  function drillPool() {
    const f = Store.s.settings.drillSet;
    return allDrillIds().filter(id => f === 'all' || CASES.get(id).setId === f);
  }
  function pickCase() {
    const cards = Store.s.cards, pool = drillPool();
    let due = Logic.dueIds(cards, pool, now());
    if (!due.length && D.ahead) due = pool.slice().sort((a, b) => cards[a].due - cards[b].due);
    if (due.length > 1 && due[0] === D.last) due = due.slice(1);
    D.id = due[0] || null;
    D.phase = 'setup'; D.options = null; D.picked = null; D.showAlg = false;
    if (D.id && CASES.get(D.id).kind === 'move') D.phase = 'solve';
  }
  function makeOptions(c) {
    const label = x => x.kind === 'move' ? x.name : x.full;
    const sameKind = [...CASES.values()].filter(x => (x.kind === 'move') === (c.kind === 'move') && x.id !== c.id);
    const near = sameKind.filter(x => (c.lesson ? x.lesson === c.lesson : x.setId === c.setId));
    const seen = new Set([label(c)]);
    const out = [c];
    for (const x of [...shuffle(near), ...shuffle(sameKind.filter(x => !near.includes(x)))]) {
      if (out.length >= 4) break;
      if (seen.has(label(x))) continue;
      seen.add(label(x)); out.push(x);
    }
    return shuffle(out).map(x => ({ id: x.id, label: label(x), auf: x.kind === 'move' ? '' : x.auf }));
  }
  function statsLine(id) {
    const k = Store.s.cards[id];
    if (!k) return '';
    const hr = Logic.hitRate(k);
    return `<div class="stats-line">
      <span class="chip" title="Leitner-Box ${k.box} von 5"><span class="box-pill">${[1, 2, 3, 4, 5].map(b => `<i class="${b <= k.box ? 'on' : ''}"></i>`).join('')}</span> Box ${k.box}</span>
      <span class="chip">${k.reps} Wdh.</span>
      <span class="chip">${hr == null ? '– %' : Math.round(hr * 100) + ' %'} Treffer</span>
      <span class="chip">zuletzt ${ago(k.last)}</span></div>`;
  }
  function drillHTML() {
    const s = Store.s.settings, cards = Store.s.cards;
    const all = allDrillIds();
    if (!all.length) {
      return `<div class="card empty"><div class="big-ico">🃏</div><h3>Noch keine Fälle im Drill</h3>
        <p class="muted">Markiere eine Lektion als gelernt oder nimm PLL/OLL-Fälle in der Übersicht auf.</p>
        <div class="btns two" style="margin-top:12px"><a class="btn primary" href="#/learn">Lernpfad</a><a class="btn" href="#/sets/pll">CFOP-Sets</a></div></div>`;
    }
    const sets = [...new Set(all.map(id => CASES.get(id).setId))];
    if (s.drillSet !== 'all' && !sets.includes(s.drillSet)) s.drillSet = 'all';
    const pool = drillPool();
    const due = Logic.dueIds(cards, pool, now()).length;
    let h = `<div class="seg" data-mode style="margin-bottom:10px">
        <button data-m="cube" class="${s.drillMode === 'cube' ? 'on' : ''}">${ICON.cube} Am Würfel</button>
        <button data-m="recog" class="${s.drillMode === 'recog' ? 'on' : ''}">Erkennen</button></div>`;
    if (sets.length > 1) h += `<div class="seg" data-set style="margin-bottom:10px"><button data-s="all" class="${s.drillSet === 'all' ? 'on' : ''}">Alle</button>${sets.map(id => `<button data-s="${id}" class="${s.drillSet === id ? 'on' : ''}">${SET_NAMES[id] || id}</button>`).join('')}</div>`;
    h += `<div class="row wrap" style="margin:0 2px 12px"><span class="chip ${due ? 'gold' : ''}">Fällig: ${due}</span><span class="chip">Im Drill: ${pool.length}</span><span class="chip">Heute geübt: ${D.session}</span></div>`;
    if (D.id && (!CASES.has(D.id) || !pool.includes(D.id))) D.id = null;
    if (!D.id) pickCase();
    if (!D.id) {
      const nd = Logic.nextDue(cards, pool);
      return h + `<div class="card empty"><div class="big-ico">✓</div><h3>Alles erledigt!</h3>
        <p class="muted">Nächster Fall fällig ${inTime(nd)}.</p>
        <button class="btn primary" data-ahead style="margin-top:10px">Trotzdem üben</button></div>`;
    }
    const c = CASES.get(D.id);
    const origin = c.lesson ? `Lektion ${c.lesson.nr} · ${c.lesson.title}` : (SET_NAMES[c.setId] + (c.group ? ' · ' + c.group : ''));
    const img = c.kind === 'move' ? dias(c, ['iso'], 'lg') : `<div class="dias lg">${c.views.map(v => dia(c, v, { arrows: false })).join('')}</div>`;
    h += `<div class="card drill-card"><div class="eyebrow">${esc(origin)}</div>${img}`;
    if (s.drillMode === 'recog') {
      if (!D.options) D.options = makeOptions(c);
      const answered = D.picked != null;
      h += `<h3 style="margin-bottom:10px">${c.kind === 'move' ? 'Welcher Zug ist das?' : 'Welcher Algorithmus löst diesen Fall?'}</h3><div class="options">` +
        D.options.map((o, k) => `<button class="option ${answered && o.id === c.id ? 'right' : ''} ${answered && D.picked === k && o.id !== c.id ? 'wrong' : ''}" data-opt="${k}" ${answered ? 'disabled' : ''}>${esc(o.label)}</button>`).join('') + '</div>';
      if (answered) {
        const ok = D.options[D.picked].id === c.id;
        h += `<p style="margin-top:12px"><b style="color:var(${ok ? '--good' : '--bad'})">${ok ? 'Richtig!' : 'Leider falsch.'}</b> ${esc(c.name)}</p>
          ${c.kind === 'move' ? '' : caseButtons(c)}
          <button class="btn primary big block" data-next style="margin-top:10px">Weiter</button>`;
      }
    } else if (D.phase === 'setup') {
      h += `<p class="muted small">1. Aufsetzen – vom gelösten Würfel aus, Gelb oben, Grün vorne:</p>
        <div class="alg md" style="margin:4px 0 12px">${esc(Cube.invertStr(c.full))}</div>
        <button class="btn primary big block" data-go>Aufgesetzt – jetzt lösen</button>`;
    } else {
      h += c.kind === 'move'
        ? `<h3>Welcher Zug ist das? Führe ihn am Würfel aus.</h3>`
        : `<p class="muted small">2. Löse den Fall jetzt aus dem Kopf.</p>`;
      h += D.showAlg
        ? `<div style="margin:10px 0"><div class="eyebrow">${esc(c.name)}</div>${algHTML(c)}</div>${c.kind === 'move' ? `<p>${esc(c.recognize)}</p>` : caseButtons(c)}`
        : `<button class="btn block" data-show style="margin:10px 0">Lösung zeigen</button>`;
      h += `<p class="muted small" style="margin:14px 0 6px">Wie gut wusstest du es?</p>
        <div class="btns three"><button class="btn good" data-g="good">Sofort<br>gewusst</button><button class="btn warn" data-g="hard">Mit<br>Mühe</button><button class="btn bad" data-g="again">Nicht<br>gewusst</button></div>`;
    }
    h += statsLine(c.id) + '</div>';
    return h;
  }
  function grade(g) {
    const k = Logic.review(Store.s.cards[D.id], g, now());
    Store.s.cards[D.id] = k; Store.save();
    D.session++; D.last = D.id;
    toast(`Box ${k.box} · wieder ${inTime(k.due)}`);
    pickCase();
  }
  VIEWS.drill = () => ({
    title: 'Drill', tab: 'drill', html: '<div data-drill></div>',
    mount(el) {
      const box = $('[data-drill]', el);
      const draw = () => { box.innerHTML = drillHTML(); };
      draw();
      bindCaseButtons(box);
      box.addEventListener('click', e => {
        const t = e.target.closest('button'); if (!t) return;
        const s = Store.s.settings;
        if (t.dataset.m) { s.drillMode = t.dataset.m; Store.save(); D.options = null; D.picked = null; D.phase = CASES.get(D.id)?.kind === 'move' ? 'solve' : 'setup'; }
        else if (t.dataset.s) { s.drillSet = t.dataset.s; Store.save(); D.id = null; }
        else if ('ahead' in t.dataset) { D.ahead = true; D.id = null; }
        else if ('go' in t.dataset) D.phase = 'solve';
        else if ('show' in t.dataset) D.showAlg = true;
        else if (t.dataset.g) grade(t.dataset.g);
        else if (t.dataset.opt != null) {
          D.picked = +t.dataset.opt;
          const ok = D.options[D.picked].id === D.id;
          const k = Logic.review(Store.s.cards[D.id], ok ? 'good' : 'again', now());
          Store.s.cards[D.id] = k; Store.save(); D.session++;
        }
        else if ('next' in t.dataset) { D.last = D.id; pickCase(); }
        else return;
        draw();
      });
    },
  });
  /* ---------- Timer ---------- */
  VIEWS.timer = () => ({
    title: 'Timer', tab: 'timer', wake: true,
    html: `<div class="card flat"><div class="row between"><span class="eyebrow">Scramble</span><button class="btn sm ghost" data-new>Neuer Scramble</button></div>
        <p class="scramble" data-scr></p>
        <details><summary class="muted small" style="cursor:pointer;min-height:36px">Vorschau des verdrehten Würfels</summary><div data-net style="margin-top:8px"></div></details></div>
      <div class="timer-pad" data-pad role="button" aria-label="Timer: gedrückt halten, loslassen startet, tippen stoppt"><div class="time" data-time>0.00</div><div class="muted small" data-hint></div></div>
      <label class="switch card flat" style="margin-top:14px;padding:6px 16px"><span>15 s Inspektion</span><input type="checkbox" data-insp ${Store.s.settings.inspection ? 'checked' : ''}></label>
      <div class="stat-grid" data-stats></div>
      <div class="section-title"><h3>Zeiten</h3><button class="btn sm ghost" data-clear>Alle löschen</button></div>
      <ul class="times" data-times></ul>`,
    mount(el) {
      const pad = $('[data-pad]', el), timeEl = $('[data-time]', el), hint = $('[data-hint]', el);
      let state = 'idle', t0 = 0, insp0 = 0, holdT = null, raf = 0, scramble = Cube.scramble(), swallowUp = false;
      const HINT = {
        idle: () => Store.s.settings.inspection ? 'Tippen startet die Inspektion.' : 'Gedrückt halten, bis die Zeit grün wird – loslassen startet.',
        inspect: () => 'Inspektion – gedrückt halten, loslassen startet.',
        holding: () => 'Halten …', ready: () => 'Loslassen!', running: () => 'Tippen stoppt.',
      };
      const showScr = () => { $('[data-scr]', el).textContent = scramble; $('[data-net]', el).innerHTML = Render.net(Cube.apply(Cube.solved(), scramble)); };
      function setState(s) {
        state = s;
        const inInsp = insp0 && (s === 'inspect' || s === 'holding' || s === 'ready');
        pad.className = 'timer-pad ' + (s === 'idle' ? '' : s) + (inInsp && s === 'inspect' ? ' inspect' : '');
        document.body.classList.toggle('timing', s !== 'idle' && (s === 'running' || !!insp0));
        hint.textContent = (HINT[s] || HINT.idle)();
      }
      function inspPenalty() {
        if (!insp0) return 0;
        const e = (performance.now() - insp0) / 1000;
        return e > 17 ? 'dnf' : e > 15 ? 2 : 0;
      }
      function tick() {
        if (state === 'running') timeEl.textContent = Logic.fmt(performance.now() - t0);
        else if (insp0) {
          const left = 15 - Math.floor((performance.now() - insp0) / 1000);
          timeEl.textContent = left > 0 ? String(left) : left > -2 ? '+2' : 'DNF';
        }
        raf = requestAnimationFrame(tick);
      }
      function down() {
        if (state === 'running') { stop(); return; }
        if (state === 'idle' && Store.s.settings.inspection) return;
        if (state === 'idle' || state === 'inspect') {
          setState('holding');
          if (!insp0) timeEl.textContent = '0.00';
          holdT = setTimeout(() => { if (state === 'holding') setState('ready'); }, 400);
        }
      }
      function up() {
        if (swallowUp) { swallowUp = false; return; }
        clearTimeout(holdT);
        if (state === 'idle' && Store.s.settings.inspection) { insp0 = performance.now(); setState('inspect'); return; }
        if (state === 'holding') setState(insp0 ? 'inspect' : 'idle');
        else if (state === 'ready') { penalty = inspPenalty(); insp0 = 0; t0 = performance.now(); setState('running'); }
      }
      let penalty = 0;
      function stop() {
        const ms = Math.round(performance.now() - t0);
        Store.s.times.push({ ms, penalty, scramble, at: Date.now() });
        Store.save();
        timeEl.textContent = Logic.fmt(Logic.effective({ ms, penalty }));
        swallowUp = true; insp0 = 0; penalty = 0;
        setState('idle');
        scramble = Cube.scramble(); showScr(); drawStats();
      }
      function drawStats() {
        const T = Store.s.times;
        const st = [['Bestzeit', Logic.fmt(T.length ? Logic.best(T) : null)], ['Ø5', Logic.fmt(Logic.average(T, 5))], ['Ø12', Logic.fmt(Logic.average(T, 12))], ['Anzahl', T.length]];
        $('[data-stats]', el).innerHTML = st.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
        const list = T.map((t, i) => [t, i]).reverse().slice(0, 100);
        $('[data-times]', el).innerHTML = list.length ? list.map(([t, i]) => `<li><span class="n">${i + 1}.</span><span class="t">${Logic.fmt(Logic.effective(t))}${t.penalty === 2 ? '<small class="muted"> (+2)</small>' : ''}</span>
          <button class="btn ${t.penalty === 2 ? 'on' : ''}" data-p2="${i}">+2</button><button class="btn ${t.penalty === 'dnf' ? 'on' : ''}" data-dnf="${i}">DNF</button><button class="btn" data-del="${i}" aria-label="Zeit löschen">✕</button></li>`).join('')
          : '<li class="muted">Noch keine Zeiten.</li>';
      }
      pad.addEventListener('pointerdown', e => { e.preventDefault(); down(); });
      pad.addEventListener('pointerup', e => { e.preventDefault(); up(); });
      pad.addEventListener('pointercancel', () => { clearTimeout(holdT); if (state === 'holding' || state === 'ready') setState(insp0 ? 'inspect' : 'idle'); });
      pad.addEventListener('contextmenu', e => e.preventDefault());
      const kd = e => {
        if (overlay) return;
        if (state === 'running') { e.preventDefault(); stop(); return; }
        if (e.code === 'Space' && !e.repeat) { e.preventDefault(); down(); }
      };
      const ku = e => { if (e.code === 'Space') { e.preventDefault(); up(); } };
      document.addEventListener('keydown', kd);
      document.addEventListener('keyup', ku);
      $('[data-new]', el).addEventListener('click', () => { scramble = Cube.scramble(); showScr(); });
      $('[data-insp]', el).addEventListener('change', e => { Store.s.settings.inspection = e.target.checked; Store.save(); setState('idle'); });
      $('[data-clear]', el).addEventListener('click', () => {
        if (Store.s.times.length && confirm('Alle Zeiten löschen?')) { Store.s.times = []; Store.save(); drawStats(); }
      });
      $('[data-times]', el).addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const T = Store.s.times;
        if (b.dataset.p2) { const t = T[+b.dataset.p2]; t.penalty = t.penalty === 2 ? 0 : 2; }
        else if (b.dataset.dnf) { const t = T[+b.dataset.dnf]; t.penalty = t.penalty === 'dnf' ? 0 : 'dnf'; }
        else if (b.dataset.del) { T.splice(+b.dataset.del, 1); }
        Store.save(); drawStats();
      });
      showScr(); drawStats(); setState('idle'); tick();
      return () => { cancelAnimationFrame(raf); document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); document.body.classList.remove('timing'); clearTimeout(holdT); };
    },
  });

  /* ---------- Sets & Übersicht ---------- */
  const tile = c => {
    const k = Store.s.cards[c.id];
    const v = c.views[0];
    return `<a class="tile ${k ? 'b' + k.box + ' indrill' : ''}" href="#/case/${c.id}">${dia(c, v === 'isoD' ? 'iso' : v)}<b>${esc(c.short || c.name)}</b></a>`;
  };
  VIEWS.sets = (id = 'pll') => {
    const set = DATA.sets.find(s => s.id === id) || DATA.sets[1];
    const cases = casesOfSet(set.id);
    const inDrill = cases.filter(c => Store.s.cards[c.id]).length;
    const mastered = cases.filter(c => (Store.s.cards[c.id] || {}).box >= 4).length;
    let h = `<div class="seg" style="margin-bottom:14px">${DATA.sets.map(s => `<button data-set="${s.id}" class="${s.id === set.id ? 'on' : ''}">${esc(s.name)}</button>`).join('')}</div>
      <div class="card"><div class="eyebrow">${esc(set.full || 'Lernpfad')}</div><h2 style="margin:2px 0 6px">${esc(set.name)}</h2><p class="muted">${esc(set.description)}</p>`;
    if (cases.length) {
      h += `<div class="progress" style="margin:10px 0 6px"><i style="width:${(mastered / cases.length) * 100}%"></i></div>
        <p class="small muted">${inDrill} von ${cases.length} im Drill · ${mastered} sicher (Box 4–5)</p>
        <div class="btns two" style="margin-top:8px"><button class="btn primary" data-addall>Alle in den Drill</button><button class="btn" data-rmall ${inDrill ? '' : 'disabled'}>Alle entfernen</button></div>`;
    }
    h += '</div>';
    h += `<div class="legend" style="margin:0 2px 8px"><span><i style="border-color:var(--b0)"></i>neu</span>${[1, 2, 3, 4, 5].map(b => `<span><i style="border-color:var(--b${b})"></i>Box ${b}</span>`).join('')}</div>`;
    if (!cases.length) {
      h += `<div class="card flat"><h3>${set.size} Fälle geplant</h3><p class="muted">Die Struktur steht: Sobald Fälle mit Algorithmus eingetragen sind, erscheinen sie hier und im Drill – Bilder und Tests entstehen automatisch aus den Algorithmen.</p>
        <ul>${(set.groups || []).map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>`;
    } else {
      const groups = new Map();
      for (const c of cases) {
        const g = c.lesson ? `Lektion ${c.lesson.nr} · ${c.lesson.title}` : c.group;
        if (!groups.has(g)) groups.set(g, []);
        groups.get(g).push(c);
      }
      for (const [g, list] of groups) h += `<div class="section-title"><h3>${esc(g)}</h3><span class="muted small">${list.length}</span></div><div class="grid">${list.map(tile).join('')}</div>`;
    }
    return {
      title: 'Sets & Übersicht', tab: 'sets', html: h,
      mount(el) {
        el.addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          if (b.dataset.set) location.hash = '#/sets/' + b.dataset.set;
          else if ('addall' in b.dataset) {
            let n = 0;
            for (const c of cases) if (!Store.s.cards[c.id]) { Store.s.cards[c.id] = Logic.newCard(now()); n++; }
            Store.save(); toast(n ? `${n} Fälle in den Drill aufgenommen` : 'Alle Fälle sind schon im Drill'); render();
          } else if ('rmall' in b.dataset) {
            if (!confirm(`Alle ${set.name}-Fälle samt Fortschritt aus dem Drill entfernen?`)) return;
            for (const c of cases) delete Store.s.cards[c.id];
            Store.save(); render();
          }
        });
      },
    };
  };

  VIEWS.case = id => {
    const c = CASES.get(id);
    if (!c) return VIEWS.sets();
    const k = Store.s.cards[c.id];
    const views = c.kind === 'move' ? ['iso'] : [...new Set([...c.views, 'iso'])];
    let h = `<div class="eyebrow">${esc(c.lesson ? `Lektion ${c.lesson.nr} · ${c.lesson.title}` : `${c.set.name} · ${c.group || ''}`)}</div>
      <h2 style="margin:2px 0 12px">${esc(c.name)}</h2>
      <div class="card"><div class="dias lg">${views.map(v => dia(c, v)).join('')}</div>
      <dl class="kv" style="margin-top:12px"><dt>Erkennen</dt><dd>${esc(c.recognize || '')}</dd>${c.hold ? `<dt>Halten</dt><dd>${esc(c.hold)}</dd>` : ''}</dl>
      <div style="margin:14px 0 4px">${algHTML(c)}</div>
      ${c.auf ? `<p class="muted small">Grau: abschliessende U-Drehung (AUF), damit die obere Ebene passt.</p>` : ''}
      <p class="muted small">${Cube.parse(c.full).length} Züge${c.kind === 'move' ? '' : ` · Aufsetzen: <span class="alg sm">${esc(Cube.invertStr(c.full))}</span>`}</p>
      ${caseButtons(c)}</div>
      <div class="card"><label class="switch"><span><b>Im Drill</b><br><span class="muted small">${k ? `Box ${k.box} · fällig ${inTime(k.due)}` : 'Noch nicht aufgenommen'}</span></span><input type="checkbox" data-drill ${k ? 'checked' : ''}></label>${statsLine(c.id)}</div>`;
    return {
      title: c.short ? (c.set ? c.set.name + ' ' + c.short : c.name) : 'Fall', back: c.lesson ? '#/lesson/' + c.lesson.id : '#/sets/' + c.setId, tab: 'sets', html: h,
      mount(el) {
        bindCaseButtons(el);
        $('[data-drill]', el).addEventListener('change', e => {
          if (e.target.checked) Store.s.cards[c.id] = Store.s.cards[c.id] || Logic.newCard(now());
          else delete Store.s.cards[c.id];
          Store.save(); render();
        });
      },
    };
  };

  /* ---------- Mehr: Einstellungen, Export/Import ---------- */
  VIEWS.more = () => {
    const s = Store.s, set = s.settings;
    const reviews = Object.values(s.cards).reduce((a, c) => a + c.reps, 0);
    const sw = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
    const h = `<div class="card"><div class="eyebrow">Dein Stand</div>
        <div class="stat-grid" style="margin-top:8px"><div class="stat"><b>${Object.keys(s.learned).length}/${LESSONS.length}</b><span>Lektionen</span></div><div class="stat"><b>${Object.keys(s.cards).length}</b><span>im Drill</span></div><div class="stat"><b>${reviews}</b><span>Wdh.</span></div><div class="stat"><b>${s.times.length}</b><span>Solves</span></div></div></div>
      <div class="card stack"><div class="eyebrow">Fortschritt sichern</div>
        <p class="muted small">Alles wird nur auf diesem Gerät gespeichert. Exportiere eine JSON-Datei als Backup oder um auf ein anderes Gerät umzuziehen.</p>
        <div class="btns two"><button class="btn primary" data-export>Exportieren</button><label class="btn">Importieren<input type="file" accept="application/json,.json" data-import hidden></label></div></div>
      <div class="card"><div class="eyebrow">Einstellungen</div>
        <div class="switch" style="cursor:default"><span>Animationstempo</span><div class="seg" data-speed>${[0.5, 1, 1.5, 2].map(v => `<button data-v="${v}" class="${set.speed === v ? 'on' : ''}">${String(v).replace('.', ',')}×</button>`).join('')}</div></div>
        <label class="switch"><span>3D-Hilfe im Zug-für-Zug-Modus</span><input type="checkbox" data-s3d ${set.show3d ? 'checked' : ''}></label>
        <label class="switch"><span>15 s Inspektion im Timer</span><input type="checkbox" data-insp ${set.inspection ? 'checked' : ''}></label></div>
      <div class="card"><div class="eyebrow">App</div>
        <p>${sw ? '<b style="color:var(--good)">✓ Offline bereit</b> – die App funktioniert ohne Internet.' : 'Offline-Speicher wird beim nächsten Laden eingerichtet.'}</p>
        <p class="muted small">Cube Coach · Farbschema: Gelb oben, Grün vorne, Weiss unten. Alle Fallbilder werden aus den Algorithmen berechnet.</p>
        <button class="btn bad block" data-reset style="margin-top:8px">Alle Daten zurücksetzen</button></div>`;
    return {
      title: 'Mehr', tab: 'more', html: h,
      mount(el) {
        $('[data-export]', el).addEventListener('click', () => {
          const blob = new Blob([JSON.stringify({ app: 'cube-coach', version: 1, exported: new Date().toISOString(), data: Store.s }, null, 1)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `cube-coach-fortschritt-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
          toast('Fortschritt exportiert');
        });
        $('[data-import]', el).addEventListener('change', async e => {
          const f = e.target.files[0]; if (!f) return;
          try {
            const o = JSON.parse(await f.text());
            const d = o && o.app === 'cube-coach' ? o.data : o;
            if (!d || typeof d !== 'object' || typeof d.cards !== 'object' || !Array.isArray(d.times)) throw new Error('Format');
            if (!confirm('Aktuellen Fortschritt durch die Datei ersetzen?')) return;
            Store.replace(d); toast('Fortschritt importiert'); render();
          } catch (err) { toast('Datei konnte nicht gelesen werden'); }
          e.target.value = '';
        });
        $('[data-speed]', el).addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; set.speed = +b.dataset.v; Store.save(); render(); });
        $('[data-s3d]', el).addEventListener('change', e => { set.show3d = e.target.checked; Store.save(); });
        $('[data-insp]', el).addEventListener('change', e => { set.inspection = e.target.checked; Store.save(); });
        $('[data-reset]', el).addEventListener('click', () => { if (confirm('Wirklich alles löschen? Lektionen, Drill und Zeiten gehen verloren.')) { Store.reset(); render(); toast('Zurückgesetzt'); } });
      },
    };
  };

  /* ---------- Router ---------- */
  const TABS = [['learn', 'Lernen'], ['drill', 'Drill'], ['timer', 'Timer'], ['sets', 'Sets'], ['more', 'Mehr']];
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<a href="#/${id}" data-tab="${id}">${ICON[id]}<span>${label}</span></a>`).join('');
  $('#back').addEventListener('click', () => { const b = $('#back').dataset.href; if (b) location.hash = b; });

  function parseHash() {
    const parts = (location.hash || '#/learn').replace(/^#\/?/, '').split('/');
    return { name: parts[0] || 'learn', arg: parts[1] ? decodeURIComponent(parts[1]) : undefined };
  }
  let lastRoute = '';
  function render() {
    const { name, arg } = parseHash();
    const fn = VIEWS[name] || VIEWS.learn;
    if (cleanup) { try { cleanup(); } catch (e) { /* ignore */ } cleanup = null; }
    const v = fn(arg);
    const main = $('#view');
    main.innerHTML = v.html;
    $('#title').innerHTML = v.brand ? `${BRAND}<span>Cube Coach</span>` : esc(v.title);
    $('#title').classList.toggle('brand', !!v.brand);
    const back = $('#back');
    back.classList.toggle('hidden', !v.back);
    back.dataset.href = v.back || '';
    $('#top-actions').innerHTML = v.actions || '';
    $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === v.tab));
    if (v.wake) Wake.on('view'); else Wake.off('view');
    if (v.mount) cleanup = v.mount(main) || null;
    const r = location.hash;
    if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
  }
  window.addEventListener('hashchange', () => { closeOverlay(true); render(); });
  if (!location.hash) history.replaceState(null, '', '#/learn');
  render();

  // Für Tests/Debugging
  window.CubeCoach = { Store, CASES, render, openTrainer, openPlayer, caseState };
})();
</script>
</body>
</html>
